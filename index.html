<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目门户</title>
<style>
  :root{--bg:#070d18;--card:#101a2b;--card2:#182438;--line:#2a3b55;--accent:#4fc3ff;--accent2:#2fb6c9;--txt:#e6edf6;--sub:#8aa0bc;--warn:#ff6b6b;--ok:#44cc55}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"Microsoft YaHei",sans-serif}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(79,195,255,.10), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(47,182,201,.08), transparent 60%),
      radial-gradient(900px 500px at 50% 120%, rgba(79,195,255,.08), transparent 60%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;padding:40px 16px;
  }
  body.gated{align-items:flex-start;padding:40px 16px}
  .wrap{width:100%;max-width:420px}
  body.gated .wrap{max-width:1200px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  body.gated .card{border-radius:20px}
  h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  h1 .dot{color:var(--accent)}
  .subtitle{color:var(--sub);font-size:13px;margin-top:6px}
  label{display:block;font-size:12px;color:var(--sub);margin:22px 0 8px}
  input{
    width:100%;background:#0c1624;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;color:var(--txt);font-size:15px;outline:none;transition:border .15s;
    font-family:inherit;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,255,.15)}
  .btn{
    width:100%;margin-top:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;border-radius:10px;color:#0a1420;font-size:15px;font-weight:600;
    padding:12px 18px;cursor:pointer;transition:transform .1s,opacity .15s;letter-spacing:.5px;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0);opacity:.85}
  .error{color:var(--warn);font-size:13px;margin-top:12px;min-height:18px}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .user-chip{
    background:var(--card2);border:1px solid var(--line);border-radius:999px;
    padding:6px 14px;font-size:12px;color:var(--sub);display:flex;gap:10px;align-items:center;
  }
  .user-chip .name{color:var(--accent);font-weight:600}
  .logout{background:none;border:none;color:var(--warn);font-size:12px;cursor:pointer;padding:0}
  .logout:hover{text-decoration:underline}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .proj{
    background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:22px;
    cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;
    position:relative;overflow:hidden;text-decoration:none;color:inherit;display:block;
  }
  .proj:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 40px rgba(79,195,255,.15)}
  .proj .emoji{font-size:32px;margin-bottom:12px;display:block}
  .proj h3{font-size:15px;font-weight:600;margin-bottom:4px}
  .proj p{font-size:12px;color:var(--sub);line-height:1.5}
  .proj .arrow{position:absolute;right:18px;bottom:16px;color:var(--accent);font-size:16px}
  .proj.missing{opacity:.45;pointer-events:none;border-style:dashed}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:28px}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录视图 -->
  <div class="card" id="login-view">
    <h1>⚗️ <span class="dot">●</span> 数字孪生项目门户</h1>
    <div class="subtitle">请输入账号密码查看您有权访问的项目</div>
    <label>账号</label>
    <input id="user" type="text" autocomplete="username" autofocus>
    <label>密码</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="btn" id="btn-login">进入项目</button>
    <div class="error" id="err"></div>
    <footer>账号密码在 <code>users.js</code> 中维护</footer>
  </div>

  <!-- 门户视图（登录后显示） -->
  <div class="card" id="gate-view" style="display:none">
    <div class="header">
      <div>
        <h1>我的项目</h1>
        <div class="subtitle" id="gate-sub"></div>
      </div>
      <div class="user-chip">
        <span>👤</span><span class="name" id="gate-user"></span>
        <span>·</span>
        <button class="logout" id="btn-logout">退出</button>
      </div>
    </div>
    <div class="grid" id="proj-grid"></div>
    <footer>
      项目目录：<code>/projects/&lt;name&gt;/</code>
      · 新增项目放到 <code>projects/</code> 文件夹，再在 <code>users.js</code> 里分配权限即可
    </footer>
  </div>

</div>

<!-- 账号配置：你只改这个文件就能增删账号、分配项目 -->
<script src="users.js"></script>
<script>
(function(){
  const SESSION_KEY = 'portal_session_v1';
  const ERR = document.getElementById('err');
  const IN_U = document.getElementById('user');
  const IN_P = document.getElementById('pass');
  const LOGIN = document.getElementById('btn-login');
  const LOGIN_V = document.getElementById('login-view');
  const GATE_V = document.getElementById('gate-view');
  const GATE_SUB = document.getElementById('gate-sub');
  const GATE_USER = document.getElementById('gate-user');
  const GRID = document.getElementById('proj-grid');

  function session() {
    try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); }
    catch(e){ return null; }
  }
  function setSession(s) { sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  function clearSession() { sessionStorage.removeItem(SESSION_KEY); }

  function getProjMeta(name) {
    // 尝试读取 project.json 获取标题和副标题
    const p = `projects/${encodeURIComponent(name)}/project.json?v=${Date.now()}`;
    return fetch(p).then(r => r.ok ? r.json() : null).catch(() => null);
  }

  async function renderGate(username) {
    const cfg = (window.USERS && window.USERS[username]) || {};
    // projects 写 "*" 表示拥有全部项目权限
    const names = cfg.projects === '*'
      ? (window.ALL_PROJECTS || [])
      : (cfg.projects || []);
    GATE_USER.textContent = username;
    GATE_SUB.textContent = `您有 ${names.length} 个可访问的项目`;
    GRID.innerHTML = '';
    for (const name of names) {
      const meta = await getProjMeta(name);
      const a = document.createElement('a');
      a.className = 'proj';
      a.href = `projects/${encodeURIComponent(name)}/`;
      const emoji = (meta && meta.emoji) || '⚗️';
      const title = (meta && meta.title) || name;
      const sub = (meta && meta.subtitle) || '';
      a.innerHTML = `<span class="emoji">${emoji}</span>
        <h3>${name}</h3>
        <p>${title}${sub ? `<br>${sub}` : ''}</p>
        <span class="arrow">→</span>`;
      // 如果目标目录没有 index.html，fetch 会 404，此时给卡片加 disabled 提示
      const check = await fetch(`projects/${encodeURIComponent(name)}/index.html`, {method:'HEAD'}).catch(() => null);
      if (!check || !check.ok) a.classList.add('missing');
      GRID.appendChild(a);
    }
    document.body.classList.add('gated');
    LOGIN_V.style.display = 'none';
    GATE_V.style.display = 'block';
  }

  function backToLogin() {
    document.body.classList.remove('gated');
    LOGIN_V.style.display = 'block';
    GATE_V.style.display = 'none';
    IN_P.value = '';
    ERR.textContent = '';
    IN_U.focus();
  }

  function login() {
    const u = IN_U.value.trim();
    const p = IN_P.value;
    const db = window.USERS || {};
    const rec = db[u];
    if (!rec || rec.pass !== p) {
      ERR.textContent = '账号或密码错误';
      return;
    }
    setSession({ user: u, t: Date.now() });
    ERR.textContent = '';
    renderGate(u);
  }

  LOGIN.addEventListener('click', login);
  IN_P.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  IN_U.addEventListener('keydown', e => { if (e.key === 'Enter') IN_P.focus(); });
  document.getElementById('btn-logout').addEventListener('click', () => { clearSession(); backToLogin(); });

  // 自动恢复会话（7 天内有效）
  const s = session();
  const MAX = 7 * 24 * 3600 * 1000;
  if (s && s.user && Date.now() - (s.t || 0) < MAX && window.USERS && window.USERS[s.user]) {
    renderGate(s.user);
  } else {
    clearSession();
    backToLogin();
  }
})();
</script>
</body>
</html>
